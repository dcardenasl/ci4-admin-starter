version: 2
updates:
  # Enable version updates for Composer
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    reviewers:
      - "dcardenasl"
    assignees:
      - "dcardenasl"
    labels:
      - "dependencies"
      - "php"

  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    reviewers:
      - "dcardenasl"
    assignees:
      - "dcardenasl"
    labels:
      - "dependencies"
      - "javascript"
