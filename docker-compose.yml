services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci4_admin_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor        # Preserve container vendor
      - /var/www/html/node_modules  # Preserve container node_modules
    env_file:
      - .env
    environment:
      CI_ENVIRONMENT: development
    networks:
      - ci4_network
    depends_on:
      - redis

  web:
    image: nginx:1.27-alpine
    container_name: ci4_admin_web
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ci4_network
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    container_name: ci4_admin_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - ci4_network

networks:
  ci4_network:
    driver: bridge
