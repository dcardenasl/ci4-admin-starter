services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci4-admin-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor        # Preserve container vendor
      - /var/www/html/node_modules  # Preserve container node_modules
    env_file:
      - .env
    environment:
      CI_ENVIRONMENT: development
    networks:
      - ci4-platform
    depends_on:
      - redis

  web:
    image: nginx:1.27-alpine
    container_name: ci4-admin-web
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ci4-platform
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    container_name: ci4-admin-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - ci4-platform

# Shared bridge network across all ci4-platform repos (admin + api + domain).
# Run once before the first `docker compose up`:
#     docker network create ci4-platform
# Marking it `external: true` lets the API container resolve `ci4-admin-app`
# by service name (and vice versa) when both compose stacks are running.
networks:
  ci4-platform:
    external: true
